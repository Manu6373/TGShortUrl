<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGShortUrl - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root {
            color-scheme: dark;
            --page: #0b0d14;
            --sidebar: #0f1118;
            --surface: #11141c;
            --raised: #1a1e28;
            --line: rgba(238, 240, 245, 0.09);
            --text: #eef0f5;
            --secondary: #a3a9b8;
            --muted: #8d95a8;
            --accent: #55a7e8;
            --positive: #4cc38a;
        }
        body {
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        }
        .glass-panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: none;
        }
        #login-screen { background: var(--page); padding: 20px; }
        #login-screen > div {
            width: min(100%, 400px);
            padding: 32px;
            text-align: left;
            border-radius: 14px;
        }
        #login-screen h2 { margin-bottom: 24px; font-size: 24px; font-weight: 500; }
        #login-screen input {
            width: 100%;
            min-height: 44px;
            margin-bottom: 12px;
            padding: 10px 12px;
            color: var(--text);
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        #admin-dashboard { min-height: 100vh; }
        #admin-dashboard aside {
            position: sticky;
            top: 0;
            flex: 0 0 256px;
            width: 256px;
            height: 100vh;
            padding: 24px 16px;
            background: var(--sidebar);
            border-color: var(--line);
        }
        #admin-dashboard aside h1 {
            margin-bottom: 28px;
            color: var(--text);
            font-size: 17px;
            font-weight: 500;
        }
        #admin-dashboard aside nav { display: flex; flex-direction: column; gap: 4px; }
        #admin-dashboard aside nav > :not([hidden]) ~ :not([hidden]) { margin-top: 0; }
        #admin-dashboard aside nav button,
        #admin-dashboard aside > button {
            min-height: 38px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--secondary);
            text-align: left;
            transition: color 150ms ease, background-color 150ms ease;
        }
        #admin-dashboard aside nav button.bg-indigo-600 {
            color: var(--text);
            background: var(--raised);
            box-shadow: inset 2px 0 var(--accent);
        }
        #admin-dashboard aside nav button:hover,
        #admin-dashboard aside > button:hover { background: var(--raised); }
        #admin-dashboard aside > button { color: #e0797d; }
        #main-content {
            width: 100%;
            max-width: 1600px;
            min-width: 0;
            margin: 0 auto;
            padding: 32px;
            background: var(--page);
        }
        #main-content h2 { color: var(--text); font-weight: 500; letter-spacing: 0; }
        #main-content .glass-panel { padding: 20px; }
        #main-content .grid.grid-cols-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        #main-content .grid.grid-cols-4 .glass-panel { min-width: 0; }
        #main-content .grid.grid-cols-4 .text-3xl,
        #main-content .grid.grid-cols-4 .text-2xl { font-variant-numeric: tabular-nums; font-weight: 500; }
        #main-content input,
        #main-content textarea,
        #main-content select {
            min-height: 40px;
            padding: 8px 10px;
            color: var(--text);
            background-color: var(--raised);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: none;
        }
        #main-content textarea { min-height: 88px; }
        #main-content input:focus,
        #main-content textarea:focus,
        #main-content select:focus,
        #login-screen input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        #main-content table { border-collapse: collapse; }
        #main-content thead { background: var(--raised); }
        #main-content th {
            padding: 12px 14px;
            color: var(--secondary);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        #main-content td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        #main-content tbody tr:last-child td { border-bottom: 0; }
        #main-content .overflow-x-auto { border-radius: 12px; }
        #main-content button,
        #login-screen button {
            min-height: 36px;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 500;
            transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
        }
        #main-content button.bg-indigo-600,
        #login-screen button {
            color: #fff;
            background: #2676b9;
        }
        #main-content button.bg-indigo-600:hover,
        #login-screen button:hover { background: #3187cb; }
        #main-content button.bg-emerald-600 { background: #226b50; }
        #main-content button.bg-red-600,
        #main-content button.bg-rose-700 { background: #762f39; }
        #main-content button:focus-visible,
        #admin-dashboard button:focus-visible,
        #login-screen button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        #main-content .uppercase { text-transform: none; letter-spacing: 0; }
        #main-content [class*="text-indigo-"] { color: var(--accent) !important; }
        #main-content [class*="text-slate-400"],
        #main-content [class*="text-slate-300"] { color: var(--secondary) !important; }
        #main-content [class*="text-slate-500"],
        #main-content [class*="text-slate-600"] { color: var(--muted) !important; }
        #main-content [class*="text-emerald-"] { color: var(--positive) !important; }
        @media (max-width: 900px) {
            #main-content { padding: 24px; }
            #main-content .grid.grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 640px) {
            #admin-dashboard { flex-direction: column; }
            #admin-dashboard aside {
                position: relative;
                flex: none;
                width: 100%;
                height: auto;
                padding: 12px 16px;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            #admin-dashboard aside h1 { margin: 0 0 12px; }
            #admin-dashboard aside nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #admin-dashboard aside > button { margin-top: 8px; }
            #main-content { padding: 20px 16px 32px; }
            #main-content .grid.grid-cols-2 { grid-template-columns: minmax(0, 1fr); }
            #main-content .grid.grid-cols-2 > .col-span-1,
            #main-content .grid.grid-cols-2 > .col-span-2 { grid-column: 1; }
            #main-content .flex.flex-wrap.items-center.justify-between { align-items: stretch; }
            #main-content #user-search { width: 100%; }
            #login-screen > div { padding: 24px; }
        }
        @media (max-width: 380px) {
            #main-content .grid.grid-cols-4 { gap: 8px; }
            #main-content .grid.grid-cols-4 .glass-panel { padding: 14px; }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="login-screen" class="absolute inset-0 z-50 bg-[#0f172a] flex items-center justify-center">
        <div class="glass-panel p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">TGShortUrl Admin</h2>
            <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg mb-4">
            <input type="password" id="admin-password" placeholder="Admin Password" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg mb-4">
            <button id="admin-login-button" onclick="adminLogin()" class="w-full bg-indigo-600 font-bold py-3 rounded-lg">Login</button>
            <div id="admin-mfa-step" class="hidden mt-4 text-left">
                <p id="admin-mfa-instructions" class="text-sm text-slate-300 mb-3">Enter the 6-digit code from your authenticator app.</p>
                <div id="admin-mfa-qr-wrap" class="hidden text-center mb-3">
                    <img id="admin-mfa-qr" alt="Authenticator setup QR code" class="mx-auto max-w-full bg-white p-2 rounded">
                    <p class="text-xs text-slate-400 mt-2">Scan this QR code with Google Authenticator, then enter the code.</p>
                </div>
                <input id="admin-mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit authenticator code" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg mb-3">
                <button id="admin-mfa-verify" onclick="verifyAdminMfa()" class="w-full bg-indigo-600 font-bold py-3 rounded-lg">Verify code</button>
            </div>
            <p id="admin-login-error" class="text-rose-400 text-sm mt-3" role="alert"></p>
        </div>
    </div>

    <div id="admin-dashboard" class="flex w-full min-h-screen hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col">
            <h1 class="text-xl font-bold text-indigo-500 mb-8"><i class="fa-solid fa-bolt mr-2"></i>Admin Panel</h1>
            <nav class="space-y-2 flex-1">
                <button class="nav-btn w-full text-left p-3 rounded bg-indigo-600 text-white" onclick="switchTab('dashboard', this)">Dashboard</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('users', this)">User Management</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('withdrawals', this)">Withdrawals</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('settings', this)">Settings</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('providers', this)">Ad Providers</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('broadcast', this)">Broadcast</button>
            </nav>
            <button onclick="adminLogout()" class="w-full p-3 text-left text-red-400 hover:bg-slate-800 rounded">Logout</button>
        </aside>
        
        <main id="main-content" class="flex-1 p-8 overflow-y-auto bg-[#0f172a]"></main>
    </div>

    <template id="tpl-dashboard">
        <h2 class="text-2xl font-bold mb-6">Platform Overview</h2>
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="glass-panel p-6"><div class="text-sm text-slate-400 mb-1">Total Users</div><div class="text-3xl font-bold" id="dash-users">0</div></div>
            <div class="glass-panel p-6"><div class="text-sm text-slate-400 mb-1">Total Links</div><div class="text-3xl font-bold" id="dash-links">0</div></div>
            <div class="glass-panel p-6"><div class="text-sm text-slate-400 mb-1">Total Clicks</div><div class="text-3xl font-bold" id="dash-clicks">0</div></div>
            <div class="glass-panel p-6"><div class="text-sm text-slate-400 mb-1">Total Earnings</div><div class="text-3xl font-bold text-emerald-400" id="dash-earn">$0.00</div></div>
        </div>
        <h2 class="text-xl font-bold mb-4">Withdrawal Statuses</h2>
        <div class="grid grid-cols-4 gap-4">
            <div class="glass-panel p-6 border border-amber-500/30"><div class="text-sm text-slate-400 mb-1">Pending</div><div class="text-2xl font-bold text-amber-400" id="dash-w-pending">0</div></div>
            <div class="glass-panel p-6 border border-indigo-500/30"><div class="text-sm text-slate-400 mb-1">Approved</div><div class="text-2xl font-bold text-indigo-400" id="dash-w-approved">0</div></div>
            <div class="glass-panel p-6 border border-emerald-500/30"><div class="text-sm text-slate-400 mb-1">Paid</div><div class="text-2xl font-bold text-emerald-400" id="dash-w-paid">0</div></div>
            <div class="glass-panel p-6 border border-rose-500/30"><div class="text-sm text-slate-400 mb-1">Rejected</div><div class="text-2xl font-bold text-rose-400" id="dash-w-rejected">0</div></div>
        </div>
    </template>
    
    <template id="tpl-users">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <h2 class="text-2xl font-bold">User Management</h2>
            <input id="user-search" type="search" placeholder="Search name, email or username..." oninput="filterAdminUsers()" class="w-full sm:w-80 bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg">
        </div>
        <div class="glass-panel overflow-x-auto shadow-xl">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-900 text-slate-400 border-b border-slate-800"><tr><th class="p-4">TG Name</th><th class="p-4">Registered Email</th><th class="p-4">TG Username</th><th class="p-4">Balance</th><th class="p-4">Total Earnings</th><th class="p-4">Status</th><th class="p-4 text-right">Action</th></tr></thead>
                <tbody id="admin-user-list"><tr><td colspan="7" class="p-4 text-slate-400">Loading users...</td></tr></tbody>
            </table>
        </div>
        <p id="user-list-count" class="text-xs text-slate-500 mt-3"></p>
    </template>

    <template id="tpl-withdrawals">
        <h2 class="text-2xl font-bold mb-6">Withdrawal Management</h2>
        <div class="glass-panel overflow-x-auto shadow-xl"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-900 text-slate-400 border-b border-slate-800"><tr><th class="p-4">User Details</th><th class="p-4">Method & TG Link</th><th class="p-4">Amount</th><th class="p-4">Status</th><th class="p-4 text-right">Action</th></tr></thead><tbody id="admin-withdraw-list"></tbody></table></div>
    </template>

    <template id="tpl-settings">
        <h2 class="text-2xl font-bold mb-6">System settings</h2>
        <div class="glass-panel p-8 grid grid-cols-2 gap-6">
            <div class="col-span-1">
                <label class="block text-xs text-slate-400 mb-1">Global CPM (USD)</label><input type="number" step="0.01" id="set-cpm" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4">
                <label class="block text-xs text-slate-400 mb-1">Referral Commission (%)</label><input type="number" min="0" max="100" step="0.1" id="set-ref-percent" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4">
                <label class="block text-xs text-slate-400 mb-1">Min Withdrawal ($)</label><input type="number" id="set-min-usd" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4">
                <label class="block text-xs text-slate-400 mb-1">IP Reward Restriction (Hours)</label><input type="number" min="0" max="720" step="1" id="set-ip-hours" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4"><p class="text-xs text-slate-500 -mt-3 mb-4">Example: 24 = one rewarded earning per IP every 24 hours. 0 = disable IP restriction.</p>
                <label class="block text-xs text-slate-400 mb-1">Withdrawals Enabled</label><select id="set-with-enable" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4"><option value="true">Yes</option><option value="false">No</option></select>
            </div>
            <div class="col-span-1">
                <label class="block text-xs text-slate-400 mb-1">Ad Timer (Sec)</label><input type="number" id="set-timer" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4">
                <label class="block text-xs text-slate-400 mb-1">Minimum Successful Ads Required</label><input id="set-ads-per-link" type="number" min="1" max="20" step="1" value="1" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-2">
                <p class="text-xs text-slate-500 mb-4">The app tries enabled rewarded providers in sequence order, skips failed/unavailable ads, and unlocks GET LINK after this many successful ad completions.</p>
                <label class="block text-xs text-slate-400 mb-1">Maintenance Mode</label><select id="set-maint" class="w-full bg-slate-900 border border-slate-700 p-2 text-white mb-4"><option value="false">Off</option><option value="true">On</option></select>
            </div>
            <button onclick="saveSettings()" class="col-span-2 bg-indigo-600 font-bold py-3 rounded-lg text-white">Save Configuration</button>
        </div>
    </template>

    <template id="tpl-providers">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div><h2 class="text-2xl font-bold">Ad Providers</h2><p class="text-sm text-slate-400 mt-1">Add and manage rewarded ad networks without editing website code.</p></div>
            <button onclick="addAdProvider()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-3 rounded-lg font-bold"><i class="fa-solid fa-plus mr-2"></i>Add New Ad</button>
        </div>
        <div class="glass-panel p-4 mb-5"><p class="text-xs text-amber-300">Enabled rewarded providers are tried in ascending sequence order. Failed or unavailable providers are skipped. The app stops after the Admin's minimum number of successful ads. Each provider's function should return a Promise that resolves only after its rewarded ad completes. Browser-side completion is not independent server-side proof of a genuine ad view.</p></div>
        <div id="provider-list" class="space-y-4"><p class="text-slate-400 text-sm">No providers added yet. Tap “Add New Ad” to begin.</p></div>
        <div class="mt-6 flex flex-wrap gap-3"><button onclick="saveAdProviders()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-3 rounded-lg font-bold">Save Ad Providers</button><button onclick="loadAdProviders()" class="bg-slate-700 px-5 py-3 rounded-lg font-bold">Reload</button></div>
    </template>

    <template id="tpl-broadcast">
        <h2 class="text-2xl font-bold mb-2">Broadcast</h2>
        <p class="text-sm text-slate-400 mb-6">Send a text message or a photo with caption to registered Telegram users.</p>
        <div class="glass-panel max-w-3xl space-y-4">
            <div>
                <label for="broadcast-message" class="block text-xs text-slate-400 mb-1">Message / Photo caption</label>
                <textarea id="broadcast-message" rows="5" maxlength="4096" placeholder="Write your message here..." class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg"></textarea>
                <p class="text-xs text-slate-500 mt-1">Text limit: 4,096 characters. Photo caption limit: 1,024 characters. Messages are sent as plain text.</p>
            </div>
            <div>
                <label for="broadcast-image-url" class="block text-xs text-slate-400 mb-1">Image URL (optional)</label>
                <input id="broadcast-image-url" type="url" inputmode="url" placeholder="https://example.com/image.jpg" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg">
                <p class="text-xs text-slate-500 mt-1">Use a publicly accessible HTTPS image URL. Leave empty for text-only broadcast.</p>
            </div>
            <label class="inline-flex items-center gap-2 text-sm text-slate-300"><input id="broadcast-button" type="checkbox" checked> Add Open TGShortUrl button</label>
            <div class="flex flex-wrap items-center gap-3">
                <button id="broadcast-send" type="button" onclick="startBroadcast()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-lg font-bold">Send Broadcast</button>
                <span id="broadcast-status" class="text-sm text-slate-400" role="status" aria-live="polite"></span>
            </div>
            <div id="broadcast-progress-wrap" class="hidden pt-2">
                <div class="flex justify-between text-xs text-slate-400 mb-2"><span id="broadcast-progress-label">Preparing...</span><span id="broadcast-progress-count">0%</span></div>
                <div class="h-2 rounded-full bg-slate-800 overflow-hidden"><div id="broadcast-progress-bar" class="h-full bg-indigo-500" style="width:0%"></div></div>
                <div class="grid grid-cols-3 gap-3 mt-4 text-sm">
                    <div class="bg-slate-900 rounded-lg p-3"><div class="text-slate-400 text-xs">Sent</div><div id="broadcast-sent" class="text-emerald-400 text-xl font-semibold">0</div></div>
                    <div class="bg-slate-900 rounded-lg p-3"><div class="text-slate-400 text-xs">Failed</div><div id="broadcast-failed" class="text-rose-400 text-xl font-semibold">0</div></div>
                    <div class="bg-slate-900 rounded-lg p-3"><div class="text-slate-400 text-xs">Total</div><div id="broadcast-total" class="text-xl font-semibold">0</div></div>
                </div>
            </div>
        </div>
    </template>

    <script>
        const SUPABASE_URL = 'https://nfjgjusfvuatjytfpfhf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aPROutC-ZbCxrxsJat8oFQ_2vI-eoaU';
        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let sessionToken = '';

        let pendingMfaFactorId = null;
        let pendingMfaChallengeId = null;
        let mfaEnrollmentRequired = false;

        function showLoginError(message) {
            const msg = document.getElementById('admin-login-error');
            if (msg) msg.textContent = message || '';
        }

        function showMfaStep(instructions, qrCode) {
            document.getElementById('admin-mfa-step').classList.remove('hidden');
            document.getElementById('admin-mfa-instructions').textContent = instructions;
            const qrWrap = document.getElementById('admin-mfa-qr-wrap');
            const qr = document.getElementById('admin-mfa-qr');
            if (qrCode) {
                qr.src = qrCode.startsWith('data:image/') ? qrCode : ('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qrCode));
                qrWrap.classList.remove('hidden');
            } else {
                qr.removeAttribute('src');
                qrWrap.classList.add('hidden');
            }
            document.getElementById('admin-mfa-code').value = '';
            document.getElementById('admin-mfa-code').focus();
        }

        async function beginAdminMfa() {
            showLoginError('');
            const { data: assurance, error: assuranceError } = await dbClient.auth.mfa.getAuthenticatorAssuranceLevel();
            if (assuranceError) throw assuranceError;
            if (assurance?.currentLevel === 'aal2') return finishAdminLogin();

            const { data: factorsData, error: factorsError } = await dbClient.auth.mfa.listFactors();
            if (factorsError) throw factorsError;
            // listFactors().totp contains verified factors only; unverified enrollments are in .all.
            const totpFactors = (factorsData?.all || []).filter(f => f.factor_type === 'totp');
            const verifiedTotp = totpFactors.find(f => f.status === 'verified');

            if (verifiedTotp) {
                pendingMfaFactorId = verifiedTotp.id;
                mfaEnrollmentRequired = false;
                const { data: challenge, error } = await dbClient.auth.mfa.challenge({ factorId: pendingMfaFactorId });
                if (error) throw error;
                pendingMfaChallengeId = challenge.id;
                showMfaStep('Enter the 6-digit code from Google Authenticator to continue.');
                return;
            }

            // A previous setup may have created an unverified factor before the QR
            // was confirmed. Remove only stale, unverified TOTP factors before
            // starting enrollment again. Never remove a verified factor.
            const staleFactors = totpFactors.filter(f => f.status !== 'verified');
            for (const staleFactor of staleFactors) {
                const { error: removeError } = await dbClient.auth.mfa.unenroll({
                    factorId: staleFactor.id
                });
                if (removeError) throw removeError;
            }

            // First-time setup: enroll a TOTP factor, then verify it before granting admin access.
            const { data: enrollment, error: enrollError } = await dbClient.auth.mfa.enroll({
                factorType: 'totp',
                friendlyName: 'TGShortUrl Admin ' + Date.now()
            });
            if (enrollError) throw enrollError;
            pendingMfaFactorId = enrollment.id;
            mfaEnrollmentRequired = true;
            showMfaStep('First-time setup: scan this QR code in Google Authenticator, then enter the 6-digit code.', enrollment.totp.qr_code);
        }

        async function verifyAdminMfa() {
            const code = document.getElementById('admin-mfa-code').value.trim();
            if (!/^\\d{6}$/.test(code)) { showLoginError('Enter a valid 6-digit authenticator code.'); return; }
            const button = document.getElementById('admin-mfa-verify');
            button.disabled = true;
            showLoginError('');
            try {
                let challengeId = pendingMfaChallengeId;
                if (mfaEnrollmentRequired) {
                    const { data: challenge, error: challengeError } = await dbClient.auth.mfa.challenge({ factorId: pendingMfaFactorId });
                    if (challengeError) throw challengeError;
                    challengeId = challenge.id;
                }
                const { error: verifyError } = await dbClient.auth.mfa.verify({
                    factorId: pendingMfaFactorId,
                    challengeId,
                    code
                });
                if (verifyError) throw verifyError;
                pendingMfaChallengeId = null;
                pendingMfaFactorId = null;
                mfaEnrollmentRequired = false;
                await finishAdminLogin();
            } catch (error) {
                showLoginError(error.message || 'Authenticator verification failed. Try again.');
            } finally {
                button.disabled = false;
            }
        }
        window.verifyAdminMfa = verifyAdminMfa;

        async function finishAdminLogin() {
            const { data: { session }, error: sessionError } = await dbClient.auth.getSession();
            if (sessionError) throw sessionError;
            if (!session) throw new Error('Please sign in again.');
            sessionToken = session.access_token;
            const { data: assurance, error: assuranceError } = await dbClient.auth.mfa.getAuthenticatorAssuranceLevel();
            if (assuranceError) throw assuranceError;
            if (assurance?.currentLevel !== 'aal2') throw new Error('Two-factor verification is required.');
            const { data: u, error: userError } = await dbClient
                .from('users').select('is_admin')
                .or(`auth_id.eq.${session.user.id},auth_user_id.eq.${session.user.id}`)
                .maybeSingle();
            if (userError) throw userError;
            if (!u?.is_admin) {
                await dbClient.auth.signOut();
                throw new Error('This account is not marked as an administrator in the users table.');
            }
            document.getElementById('admin-mfa-step').classList.add('hidden');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            switchTab('dashboard', document.querySelector('.nav-btn'));
            return true;
        }

        async function checkAdmin() {
            try {
                const { data: { session }, error: sessionError } = await dbClient.auth.getSession();
                if (sessionError) throw sessionError;
                if (!session) return false;
                await beginAdminMfa();
                return true;
            } catch (error) {
                console.error('Admin authentication error:', error);
                showLoginError(error.message || 'Could not verify admin access.');
                return false;
            }
        }
        window.onload = checkAdmin;

        async function adminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value;
            showLoginError('');
            if (!email || !pass) { showLoginError('Enter your email and password.'); return; }
            const button = document.getElementById('admin-login-button');
            button.disabled = true;
            try {
                const { error } = await dbClient.auth.signInWithPassword({ email, password: pass });
                if (error) throw error;
                await beginAdminMfa();
            } catch (error) {
                showLoginError(error.message || 'Login failed.');
            } finally {
                button.disabled = false;
            }
        }
        async function adminLogout() { await dbClient.auth.signOut(); location.reload(); }
        async function fetchApi(action, data={}) {
            const res = await fetch('/api/admin', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
                body: JSON.stringify({ action, ...data })
            });
            return await res.json();
        }

        window.switchTab = function(tab, btn) {
            if (broadcastRunning && tab !== 'broadcast') { alert('Please wait until the broadcast finishes.'); return; }
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('bg-indigo-600', 'text-white'); b.classList.add('text-slate-400'); });
            if(btn) { btn.classList.add('bg-indigo-600', 'text-white'); btn.classList.remove('text-slate-400'); }
            document.getElementById('main-content').innerHTML = document.getElementById(`tpl-${tab}`).innerHTML;
            if(tab === 'dashboard') loadDash();
            if(tab === 'users') loadUsers();
            if(tab === 'withdrawals') loadWithdrawals();
            if(tab === 'settings') loadSettings();
            if(tab === 'providers') loadAdProviders();
            if(tab === 'broadcast') resetBroadcastView();
        }

        async function loadDash() {
            const data = await fetchApi('dashboard_stats');
            document.getElementById('dash-users').innerText = data.users;
            document.getElementById('dash-links').innerText = data.links;
            document.getElementById('dash-clicks').innerText = data.clicks;
            document.getElementById('dash-earn').innerText = `$${(data.earnings||0).toFixed(2)}`;
            document.getElementById('dash-w-pending').innerText = data.withdrawals?.pending || 0;
            document.getElementById('dash-w-approved').innerText = data.withdrawals?.approved || 0;
            document.getElementById('dash-w-paid').innerText = data.withdrawals?.paid || 0;
            document.getElementById('dash-w-rejected').innerText = data.withdrawals?.rejected || 0;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        let adminUsers = [];
        async function loadUsers() {
            const tbody = document.getElementById('admin-user-list');
            tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-slate-400">Loading users...</td></tr>';
            const res = await fetchApi('users');
            if (res.error) { tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-rose-400">${escapeHtml(res.error)}</td></tr>`; return; }
            adminUsers = res.data || [];
            filterAdminUsers();
        }

        window.filterAdminUsers = function() {
            const query = (document.getElementById('user-search')?.value || '').trim().toLowerCase();
            const filtered = adminUsers.filter(u => {
                const name = [u.first_name, u.last_name].filter(Boolean).join(' ');
                return [name, u.email, u.username, u.telegram_id].some(value => String(value || '').toLowerCase().includes(query));
            });
            const tbody = document.getElementById('admin-user-list');
            if (!tbody) return;
            tbody.innerHTML = filtered.length ? filtered.map(u => {
                const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'N/A';
                const username = u.username ? '@' + String(u.username).replace(/^@/, '') : 'N/A';
                return `<tr class="border-b border-slate-800"><td class="p-4 font-semibold">${escapeHtml(name)}</td><td class="p-4">${escapeHtml(u.email || 'N/A')}</td><td class="p-4">${escapeHtml(username)}</td><td class="p-4">$${Number(u.balance || 0).toFixed(4)}</td><td class="p-4 text-emerald-400">$${Number(u.total_earnings || 0).toFixed(4)}</td><td class="p-4"><span class="${u.is_blocked ? 'text-rose-400' : 'text-emerald-400'}">${u.is_blocked ? 'Blocked' : 'Active'}</span></td><td class="p-4 text-right">${u.is_admin ? '<span class="text-slate-500">Admin</span>' : `<button onclick="toggleUserBlock('${u.id}', ${!u.is_blocked})" class="px-3 py-1 rounded ${u.is_blocked ? 'bg-emerald-700' : 'bg-rose-700'} text-white">${u.is_blocked ? 'Unblock' : 'Block'}</button>`}</td></tr>`;
            }).join('') : '<tr><td colspan="7" class="p-4 text-slate-400">No users found.</td></tr>';
            const count = document.getElementById('user-list-count');
            if (count) count.textContent = `Showing ${filtered.length} of ${adminUsers.length} users`;
        };

        window.toggleUserBlock = async function(id, block) {
            const action = block ? 'block' : 'unblock';
            if (!confirm(`Are you sure you want to ${action} this user?`)) return;
            const result = await fetchApi('block', { id, block });
            if (result.error) alert(result.error);
            else loadUsers();
        };

        async function loadWithdrawals() {
            const res = await fetchApi('withdrawals');
            const tbody = document.getElementById('admin-withdraw-list'); tbody.innerHTML = '';
            if (res.error) { tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-rose-400">${escapeHtml(res.error)}</td></tr>`; return; }
            res.data?.forEach(w => {
                let act = '';
                if(w.status === 'pending') act = `<button onclick="processW('${w.id}', 'approved')" class="bg-indigo-600 px-3 py-1 rounded text-white mr-1">Approve</button><button onclick="processW('${w.id}', 'rejected')" class="bg-red-600 px-3 py-1 rounded text-white">Reject</button>`;
                else if(w.status === 'approved') act = `<button onclick="processW('${w.id}', 'paid')" class="bg-emerald-600 px-3 py-1 rounded text-white">Mark as Paid</button>`;
                const details = w.user_details || {};
                tbody.innerHTML += `<tr class="border-b border-slate-800"><td class="p-4"><div class="font-bold">${escapeHtml(details.tg_name || 'N/A')}</div><div class="text-xs text-slate-400">${escapeHtml(details.email || 'N/A')}</div><div class="text-xs text-slate-500">${escapeHtml(details.username || 'N/A')}</div></td><td class="p-4 text-xs font-mono"><b>${escapeHtml(w.method)}</b><br>${escapeHtml(w.details)}<br><a href="${escapeHtml(w.telegram_link)}" target="_blank" rel="noopener" class="text-indigo-400 underline">TG Link</a></td><td class="p-4 font-bold">$${Number(w.amount || 0).toFixed(4)}<br><span class="text-xs text-emerald-400">₹${(Number(w.amount || 0)*85).toFixed(2)}</span></td><td class="p-4 uppercase text-xs font-bold">${escapeHtml(w.status)}</td><td class="p-4 text-right">${act}</td></tr>`;
            });
        }

        window.processW = async function(id, status) {
            if(!confirm(`Confirm mark as ${status}?`)) return;
            const res = await fetchApi('withdrawal', { id, status });
            if(res.error) alert(res.error); else loadWithdrawals();
        }

        async function loadSettings() {
            const res = await fetchApi('settings');
            const d = res.data;
            if(d) {
                document.getElementById('set-cpm').value = d.cpm || 2;
                document.getElementById('set-ref-percent').value = d.refer_percent ?? 1;
                document.getElementById('set-min-usd').value = d.min_withdraw ?? 5;
                document.getElementById('set-ip-hours').value = d.ip_restrict_hours ?? 24;
                document.getElementById('set-with-enable').value = d.withdrawals_enabled ? "true" : "false";
                document.getElementById('set-timer').value = d.ad_timer || 5;
                document.getElementById('set-ads-per-link').value = Math.max(1, Number(d.ads_per_link) || 1);
                document.getElementById('set-maint').value = d.maintenance_mode ? "true" : "false";
            }
        }

        window.saveSettings = async function() {
            const req = {
                cpm: parseFloat(document.getElementById('set-cpm').value),
                refer_percent: Math.max(0, Math.min(100, parseFloat(document.getElementById('set-ref-percent').value) || 0)),
                min_withdraw: parseFloat(document.getElementById('set-min-usd').value),
                ip_restrict_hours: Math.max(0, Math.min(720, parseInt(document.getElementById('set-ip-hours').value, 10) || 0)),
                withdrawals_enabled: document.getElementById('set-with-enable').value === 'true',
                ad_timer: parseInt(document.getElementById('set-timer').value),
                maintenance_mode: document.getElementById('set-maint').value === 'true',
                ads_per_link: Math.max(1, Math.min(20, parseInt(document.getElementById('set-ads-per-link').value, 10) || 1))
            };
            if (!Number.isFinite(req.min_withdraw) || req.min_withdraw <= 0) {
                alert('Enter a valid minimum withdrawal amount in USD.');
                return;
            }
            const res = await fetchApi('saveSettings', { data: req });
            if(res.error) alert(res.error); else alert('Settings Saved!');
        }

        let broadcastRunning = false;
        window.resetBroadcastView = function() {
            if (broadcastRunning) return;
            const wrap = document.getElementById('broadcast-progress-wrap');
            if (wrap) wrap.classList.add('hidden');
            const button = document.getElementById('broadcast-send');
            if (button) { button.disabled = false; button.textContent = 'Send Broadcast'; }
            const status = document.getElementById('broadcast-status');
            if (status) status.textContent = '';
        };

        window.startBroadcast = async function() {
            if (broadcastRunning) return;
            const message = document.getElementById('broadcast-message')?.value.trim() || '';
            const imageUrl = document.getElementById('broadcast-image-url')?.value.trim() || '';
            const useButton = document.getElementById('broadcast-button')?.checked !== false;
            const status = document.getElementById('broadcast-status');
            if (!message) { alert('Enter a message or photo caption first.'); return; }
            if (imageUrl) {
                try {
                    const parsed = new URL(imageUrl);
                    if (parsed.protocol !== 'https:') throw new Error('HTTPS required');
                } catch { alert('Enter a valid public HTTPS image URL.'); return; }
                if (message.length > 1024) { alert('Photo caption must be 1,024 characters or fewer.'); return; }
            } else if (message.length > 4096) {
                alert('Text message must be 4,096 characters or fewer.'); return;
            }
            if (!confirm('Send this broadcast to all registered Telegram users? This action cannot be undone.')) return;

            broadcastRunning = true;
            const button = document.getElementById('broadcast-send');
            const wrap = document.getElementById('broadcast-progress-wrap');
            const progressBar = document.getElementById('broadcast-progress-bar');
            const progressLabel = document.getElementById('broadcast-progress-label');
            const progressCount = document.getElementById('broadcast-progress-count');
            const sentEl = document.getElementById('broadcast-sent');
            const failedEl = document.getElementById('broadcast-failed');
            const totalEl = document.getElementById('broadcast-total');
            button.disabled = true;
            button.textContent = 'Sending...';
            wrap.classList.remove('hidden');
            status.textContent = 'Starting broadcast...';
            let offset = 0, sent = 0, failed = 0, total = null;
            try {
                let done = false;
                while (!done) {
                    const response = await fetch('/api/broadcast', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
                        body: JSON.stringify({ offset, message, image_url: imageUrl, use_button: useButton })
                    });
                    const result = await response.json();
                    if (!response.ok || !result.ok) throw new Error(result.error || 'Broadcast request failed.');
                    sent += Number(result.sent || 0);
                    failed += Number(result.failed || 0);
                    total = Number(result.total || 0);
                    offset = Number(result.next_offset || offset);
                    done = !!result.done;
                    const processed = Math.min(offset, total);
                    const percent = total ? Math.min(100, Math.round(processed / total * 100)) : 100;
                    sentEl.textContent = sent;
                    failedEl.textContent = failed;
                    totalEl.textContent = total;
                    progressBar.style.width = `${percent}%`;
                    progressCount.textContent = `${percent}%`;
                    progressLabel.textContent = `Processed ${processed} of ${total}`;
                    status.textContent = done ? 'Broadcast completed.' : 'Sending messages...';
                }
                if (total === 0) status.textContent = 'No registered Telegram users were found.';
                else status.textContent = `Broadcast completed. Sent: ${sent}, failed: ${failed}.`;
            } catch (error) {
                status.textContent = `Stopped: ${error.message} Refresh this section before retrying; already sent messages will not be rolled back.`;
            } finally {
                broadcastRunning = false;
                button.disabled = false;
                button.textContent = 'Send Broadcast';
            }
        };

        let adProviders = [];
        function safeProviderId(name) {
            return String(name || 'provider').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'provider';
        }
        async function loadAdProviders() {
            const list = document.getElementById('provider-list');
            if (!list) return;
            list.innerHTML = '<p class="text-slate-400">Loading providers...</p>';
            const res = await fetchApi('settings');
            if (res.error) { list.innerHTML = `<p class="text-rose-400">${res.error}</p>`; return; }
            adProviders = Array.isArray(res.data?.ad_providers) ? res.data.ad_providers : [];
            renderAdProviders();
        }
        function renderAdProviders() {
            const list = document.getElementById('provider-list'); if (!list) return;
            if (!adProviders.length) { list.innerHTML = '<div class="glass-panel p-6 text-center text-slate-400">No ad providers added yet. Tap “Add New Ad”.</div>'; return; }
            list.innerHTML = adProviders.map((p, i) => `<div class="glass-panel p-5 space-y-3" data-provider-index="${i}">
                <div class="flex justify-between items-center gap-2"><h3 class="font-bold">Ad Provider ${i+1}</h3><button onclick="removeAdProvider(${i})" class="text-rose-400 text-sm"><i class="fa-solid fa-trash mr-1"></i>Delete</button></div>
                <div class="grid md:grid-cols-2 gap-3">
                    <label class="text-xs text-slate-400">Provider Name<input data-field="name" value="${escapeAttr(p.name||'')}" class="mt-1 w-full bg-slate-900 border border-slate-700 p-2 rounded text-white"></label>
                    <label class="text-xs text-slate-400">Ad Type<input value="Rewarded" disabled class="mt-1 w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-300"><input data-field="type" type="hidden" value="rewarded"></label>
                    <label class="text-xs text-slate-400 md:col-span-2">SDK Script / Embed Code<textarea data-field="script" rows="3" class="mt-1 w-full bg-slate-900 border border-slate-700 p-2 rounded text-white" placeholder="Paste the provider SDK script tag">${escapeHtml(p.script||'')}</textarea></label>
                    <label class="text-xs text-slate-400">Function Name (rewarded ads)<input data-field="function_name" value="${escapeAttr(p.function_name||'')}" placeholder="window.showAd" class="mt-1 w-full bg-slate-900 border border-slate-700 p-2 rounded text-white"></label>
                    <label class="text-xs text-slate-400">Sequence Order<input data-field="order" type="number" min="1" value="${Number(p.order)||i+1}" class="mt-1 w-full bg-slate-900 border border-slate-700 p-2 rounded text-white"></label>
                </div>
                <label class="inline-flex items-center gap-2 text-sm"><input data-field="enabled" type="checkbox" ${p.enabled?'checked':''}> Enabled</label>
            </div>`).join('');
        }
        function escapeHtml(v) { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function escapeAttr(v) { return escapeHtml(v); }
        window.addAdProvider = function() { collectProviderInputs(); adProviders.push({ id:'', name:'', type:'rewarded', script:'', function_name:'', order:(Math.max(0,...adProviders.map(p=>Number(p.order)||0))+1), enabled:true }); renderAdProviders(); };
        function collectProviderInputs() {
            document.querySelectorAll('#provider-list [data-provider-index]').forEach(card => {
                const i=Number(card.dataset.providerIndex); if (!adProviders[i]) return;
                card.querySelectorAll('[data-field]').forEach(el => { const k=el.dataset.field; adProviders[i][k] = el.type==='checkbox' ? el.checked : (k==='order' ? Number(el.value)||1 : el.value); });
            });
        }
        window.removeAdProvider = function(i) { collectProviderInputs(); adProviders.splice(i,1); renderAdProviders(); };
        window.saveAdProviders = async function() {
            collectProviderInputs();
            const seen = new Set();
            for (const p of adProviders) {
                if (!p.name.trim()) return alert('Enter a name for every ad provider.');
                if (!p.script.trim()) return alert(`Add the SDK script for ${p.name}.`);
                if (p.type === 'rewarded' && !p.function_name.trim()) return alert(`Enter the reward function name for ${p.name}.`);
                p.id = safeProviderId(p.name);
                if (seen.has(p.id)) return alert('Provider names must be unique.');
                seen.add(p.id);
            }
            adProviders.sort((a,b)=>Number(a.order)-Number(b.order));
            const res = await fetchApi('saveSettings', { data: { ad_providers: adProviders } });
            if (res.error) alert(res.error); else alert('Ad providers saved successfully.');
        };
    </script>
</body>
</html>
