<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGShortUrl - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- ADMIN LOGIN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-[#0f172a] flex items-center justify-center">
        <div class="glass-panel p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-2">TGShortUrl Admin</h2>
            <p class="text-sm text-slate-400 mb-6">Server-side Authenticated Access</p>
            <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg mb-4">
            <input type="password" id="admin-password" placeholder="Admin Password" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-lg mb-4">
            <button onclick="adminLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg">Login Securely</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="flex w-full h-full hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 hidden md:flex flex-col">
            <h1 class="text-xl font-bold text-indigo-500 mb-8"><i class="fa-solid fa-bolt mr-2"></i>Admin Panel</h1>
            <nav class="space-y-2 flex-1">
                <button class="nav-btn w-full text-left p-3 rounded bg-indigo-600 text-white" onclick="switchTab('users', this)">Users</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('withdrawals', this)">Withdrawals</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('settings', this)">Settings & Ads</button>
                <button class="nav-btn w-full text-left p-3 rounded text-slate-400 hover:bg-slate-800" onclick="switchTab('broadcast', this)">Broadcast</button>
            </nav>
            <button onclick="adminLogout()" class="w-full p-3 text-left text-red-400 hover:bg-slate-800 rounded">Logout</button>
        </aside>
        <main id="main-content" class="flex-1 p-8 overflow-y-auto bg-[#0f172a]"></main>
    </div>

    <!-- TEMPLATES -->
    <template id="tpl-users">
        <h2 class="text-2xl font-bold mb-6">User Management</h2>
        <div class="glass-panel overflow-x-auto shadow-xl"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-900 text-slate-400 border-b border-slate-800"><tr><th class="p-4">Email</th><th class="p-4">TG ID</th><th class="p-4">Balance</th><th class="p-4">Status</th><th class="p-4 text-right">Action</th></tr></thead><tbody id="admin-users-list"></tbody></table></div>
    </template>
    
    <template id="tpl-withdrawals">
        <h2 class="text-2xl font-bold mb-6">Withdrawal Requests</h2>
        <div class="glass-panel overflow-x-auto shadow-xl"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-900 text-slate-400 border-b border-slate-800"><tr><th class="p-4">User</th><th class="p-4">Method & Details</th><th class="p-4">Amount</th><th class="p-4 text-center">Action</th></tr></thead><tbody id="admin-withdraw-list"></tbody></table></div>
    </template>

    <template id="tpl-settings">
        <h2 class="text-2xl font-bold mb-6">App & Advertisement Settings</h2>
        <div class="glass-panel p-8 shadow-xl grid grid-cols-2 gap-6">
            <!-- General Settings -->
            <div class="col-span-2 md:col-span-1 border-b border-slate-700 pb-4">
                <h3 class="text-lg font-bold text-indigo-400 mb-4">General Params</h3>
                <div class="mb-3"><label class="block text-xs font-bold text-slate-400 uppercase">Global CPM ($)</label><input type="number" step="0.01" id="set-cpm" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
                <div class="mb-3"><label class="block text-xs font-bold text-slate-400 uppercase">Referral Bonus (%)</label><input type="number" id="set-ref" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
                <div class="mb-3"><label class="block text-xs font-bold text-slate-400 uppercase">Min Withdraw ($)</label><input type="number" step="0.5" id="set-min-with" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
                <div class="mb-3"><label class="block text-xs font-bold text-slate-400 uppercase">IP Restrict (Hours)</label><input type="number" id="set-ip-hours" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" value="24"></div>
            </div>
            
            <!-- Social Links -->
            <div class="col-span-2 border-b border-slate-700 pb-4">
                <h3 class="text-lg font-bold text-sky-400 mb-4">Social Links</h3>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Official Telegram Channel URL</label>
                <input type="url" id="set-telegram-url" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white" placeholder="https://t.me/TGShortUrl">
                <p class="text-xs text-slate-500 mt-2">This link appears in the Mini App Profile. Changes take effect after saving; no code edit is needed.</p>
            </div>

            <!-- Ad Settings -->
            <div class="col-span-2 md:col-span-1 border-b border-slate-700 pb-4">
                <h3 class="text-lg font-bold text-amber-400 mb-4">Ad Provider Config</h3>
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Active Rewarded Ad</label>
                    <select id="set-active-ad" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"><option value="monetag">Monetag</option><option value="adsbitvex">AdsBitVex</option><option value="both">Both</option></select>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Active Banner Ad</label>
                    <select id="set-active-banner" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"><option value="none">None</option><option value="monetag">Monetag</option><option value="adsbitvex">AdsBitVex</option></select>
                </div>
                <div class="mb-3"><label class="block text-xs font-bold text-slate-400 uppercase">Ad Timer (Seconds)</label><input type="number" id="set-timer" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
            </div>

            <!-- Monetag scripts -->
            <div class="col-span-2">
                <label class="block text-xs font-bold text-slate-400 uppercase">Monetag Rewarded SDK Code</label>
                <textarea id="set-mone-script" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></textarea>
                <label class="block text-xs font-bold text-slate-400 uppercase mt-2">Monetag Function Name</label>
                <input type="text" id="set-mone-func" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="show_12122788">
            </div>

            <!-- AdsBitVex scripts -->
            <div class="col-span-2">
                <label class="block text-xs font-bold text-slate-400 uppercase">AdsBitVex Rewarded SDK Code</label>
                <textarea id="set-abx-script" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></textarea>
                <label class="block text-xs font-bold text-slate-400 uppercase mt-2">AdsBitVex Function Name</label>
                <input type="text" id="set-abx-func" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="window.showadsbitvex">
            </div>
            
            <!-- Banner Codes -->
            <div class="col-span-2">
                <label class="block text-xs font-bold text-slate-400 uppercase">AdsBitVex Banner HTML/JS</label>
                <textarea id="set-abx-banner" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></textarea>
            </div>

            <button onclick="saveSettings()" class="col-span-2 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold text-white transition">Save All Settings</button>
        </div>
    </template>

    <template id="tpl-broadcast">
        <h2 class="text-2xl font-bold mb-6">Bot Broadcast</h2>
        <div class="glass-panel p-6 max-w-xl">
            <textarea id="bc-caption" rows="5" placeholder="Message content..." class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white mb-4"></textarea>
            <input type="url" id="bc-mini-app-url" value="https://tgshorturl.vercel.app/" class="w-full bg-slate-800 border border-slate-700 rounded p-3 text-white mb-4">
            <button onclick="sendBroadcast()" class="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-lg font-bold text-white shadow-lg">Broadcast to All Users</button>
        </div>
    </template>

    <script>
        const SUPABASE_URL = 'https://nfjgjusfvuatjytfpfhf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_aPROutC-ZbCxrxsJat8oFQ_2vI-eoaU';
        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let settingsId = null;

        async function checkAdmin() {
            const { data: { session } } = await dbClient.auth.getSession();
            if (session) {
                const { data: u } = await dbClient.from('users').select('is_admin').eq('auth_id', session.user.id).single();
                if (u && u.is_admin) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    switchTab('users', document.querySelector('.nav-btn'));
                } else { alert("Not an admin."); dbClient.auth.signOut(); }
            }
        }
        window.onload = checkAdmin;

        async function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            const { error } = await dbClient.auth.signInWithPassword({ email: email, password: pass });
            if (error) alert(error.message); else checkAdmin();
        }
        async function adminLogout() { await dbClient.auth.signOut(); location.reload(); }

        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('bg-indigo-600', 'text-white'); b.classList.add('text-slate-400'); });
            if(btn) { btn.classList.add('bg-indigo-600', 'text-white'); btn.classList.remove('text-slate-400'); }
            document.getElementById('main-content').innerHTML = document.getElementById(`tpl-${tab}`).innerHTML;
            if(tab === 'users') loadUsers();
            if(tab === 'withdrawals') loadWithdrawals();
            if(tab === 'settings') loadSettings();
        }

        async function loadUsers() {
            const { data } = await dbClient.from('users').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('admin-users-list'); tbody.innerHTML = '';
            data?.forEach(u => tbody.innerHTML += `<tr class="border-b border-slate-800"><td class="p-4 text-xs">${u.email || 'N/A'}</td><td class="p-4 text-xs font-mono text-indigo-400">${u.telegram_id || 'N/A'}</td><td class="p-4 text-emerald-400 font-bold">$${parseFloat(u.balance).toFixed(2)}</td><td class="p-4">${u.is_blocked ? '<span class="text-red-500">Blocked</span>' : '<span class="text-green-500">Active</span>'}</td><td class="p-4 text-right"><button onclick="toggleBlock('${u.id}', ${!u.is_blocked})" class="text-amber-500 mr-2">Toggle Ban</button></td></tr>`);
        }

        window.toggleBlock = async function(userId, block) {
            await dbClient.from('users').update({ is_blocked: block }).eq('id', userId); loadUsers();
        }

        async function loadWithdrawals() {
            const { data } = await dbClient.from('withdrawals').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('admin-withdraw-list'); tbody.innerHTML = '';
            data?.forEach(w => {
                let actionHtml = w.status === 'pending' ? `<button onclick="processW('${w.id}', '${w.user_id}', ${w.amount}, 'approved')" class="bg-green-600 px-2 rounded mr-1">Approve</button><button onclick="processW('${w.id}', '${w.user_id}', ${w.amount}, 'rejected')" class="bg-red-600 px-2 rounded">Reject</button>` : w.status;
                tbody.innerHTML += `<tr class="border-b border-slate-800"><td class="p-4 text-xs">${w.user_id.substring(0,8)}</td><td class="p-4 text-xs"><b>${w.method}</b> - ${w.details}</td><td class="p-4 text-emerald-400 font-bold">$${w.amount.toFixed(2)}</td><td class="p-4 text-center text-xs">${actionHtml}</td></tr>`;
            });
        }

        window.processW = async function(wId, uId, amt, status) {
            await dbClient.from('withdrawals').update({ status }).eq('id', wId);
            if(status === 'rejected') {
                const { data: u } = await dbClient.from('users').select('balance').eq('id', uId).single();
                if(u) await dbClient.from('users').update({ balance: parseFloat(u.balance) + parseFloat(amt) }).eq('id', uId);
            }
            loadWithdrawals();
        }

        async function loadSettings() {
            const { data } = await dbClient.from('settings').select('*').limit(1).single();
            if(data) {
                settingsId = data.id;
                document.getElementById('set-cpm').value = data.cpm || 2;
                document.getElementById('set-ref').value = data.refer_percent || 10;
                document.getElementById('set-min-with').value = data.min_withdraw || 5;
                document.getElementById('set-timer').value = data.ad_timer || 5;
                document.getElementById('set-ip-hours').value = data.ip_restrict_hours || 24;
                document.getElementById('set-telegram-url').value = data.telegram_channel_url || 'https://t.me/TGShortUrl';
                
                document.getElementById('set-active-ad').value = data.active_reward_ad || 'monetag';
                document.getElementById('set-active-banner').value = data.active_banner_ad || 'none';
                
                document.getElementById('set-mone-script').value = data.monetag_reward_script || "<script src='//libtl.com/sdk.js' data-zone='12122788' data-sdk='show_12122788'><\/script>";
                document.getElementById('set-mone-func').value = data.monetag_reward_func || 'show_12122788';
                
                document.getElementById('set-abx-script').value = data.adsbitvex_reward_script || '<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000540"><\/script>'; 
                document.getElementById('set-abx-func').value = data.adsbitvex_reward_func || 'showadsbitvex';
                
                document.getElementById('set-abx-banner').value = data.adsbitvex_banner_code || '';
            }
        }

        window.saveSettings = async function() {
            const updates = {
                cpm: parseFloat(document.getElementById('set-cpm').value),
                refer_percent: parseInt(document.getElementById('set-ref').value),
                min_withdraw: parseFloat(document.getElementById('set-min-with').value),
                ad_timer: parseInt(document.getElementById('set-timer').value),
                ip_restrict_hours: parseInt(document.getElementById('set-ip-hours').value),
                telegram_channel_url: document.getElementById('set-telegram-url').value.trim() || 'https://t.me/TGShortUrl',
                active_reward_ad: document.getElementById('set-active-ad').value,
                active_banner_ad: document.getElementById('set-active-banner').value,
                monetag_reward_script: document.getElementById('set-mone-script').value,
                monetag_reward_func: document.getElementById('set-mone-func').value,
                adsbitvex_reward_script: document.getElementById('set-abx-script').value,
                adsbitvex_reward_func: document.getElementById('set-abx-func').value,
                adsbitvex_banner_code: document.getElementById('set-abx-banner').value
            };
            const telegramUrl = updates.telegram_channel_url;
            if (!/^https:\/\/t\.me\/[A-Za-z0-9_+\/-]+$/.test(telegramUrl)) return alert('Enter a valid Telegram channel URL (https://t.me/...).');
            const result = settingsId
                ? await dbClient.from('settings').update(updates).eq('id', settingsId)
                : await dbClient.from('settings').insert([updates]);
            if (result.error) return alert('Settings save failed: ' + result.error.message);
            alert("Settings Saved Successfully!");
        }

        window.sendBroadcast = async function() {
            const caption = document.getElementById('bc-caption').value;
            const url = document.getElementById('bc-mini-app-url').value;
            if(!caption) return alert("Enter message!");
            try {
                const { data: users } = await dbClient.from('users').select('telegram_id').not('telegram_id', 'is', null);
                const chatIds = users.map(u => u.telegram_id);
                await fetch('/api/broadcast', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_ids: chatIds, caption: caption, mini_app_url: url }) });
                alert("Broadcast sent via Vercel backend!");
            } catch(e) { alert(e.message); }
        }
    </script>
</body>
</html>
